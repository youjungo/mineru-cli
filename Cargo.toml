[package]
name = "mineru-cli"
version = "1.8.2"
description = "基于 MinerU API 的文档批量转换 CLI 工具"
authors = ["youjungo"]
edition = "2021"
license = "MIT"
repository = "https://github.com/youjungo/mineru-cli"
homepage = "https://github.com/youjungo/mineru-cli"
readme = "README.md"
keywords = ["mineru", "markdown", "pdf", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "mineru-cli"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
lopdf = "0.34"
rayon = "1.10"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
uuid = { version = "1.0", features = ["v4"] }
walkdir = "2.5"
zip = "2.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
